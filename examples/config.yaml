version: 1
profiles_directory: profiles
pi:
  executable: /ABSOLUTE/PATH/TO/pi
  coding_agent_directory: /Users/USERNAME/.pi/agent
  session_directory: /Users/USERNAME/.beacon/sessions
runs:
  # Host-wide ceiling across all Profiles (active Runs only).
  max_concurrent: 3
  # Default per-Profile queue depth (queues are isolated per Profile).
  max_queued: 100
  # Default per-Profile concurrency when profile.yaml omits max_concurrent.
  default_max_concurrent: 1
  timeout_seconds: 1800
  terminate_grace_seconds: 5
scheduler:
  max_occurrences_per_reconciliation: 1000
dashboard:
  enabled: true
  listen: 0.0.0.0
  port: 46183
# Opt in after creating a private event-credentials.json; see README.
events:
  enabled: false
  listen: 127.0.0.1
  port: 46184
  max_body_bytes: 262144
  max_pending: 1000
  credentials_file: event-credentials.json
