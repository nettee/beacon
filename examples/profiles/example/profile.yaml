playbook: ../../playbook
runtime: pi
model:
  provider: REPLACE_WITH_PI_PROVIDER
  id: REPLACE_WITH_PI_MODEL
# Optional weighted pool: each Run picks one entry by weight. Doctor still uses `model`.
# Delete model_pool to pin a single model again.
# model_pool:
#   - provider: REPLACE_WITH_PI_PROVIDER
#     id: REPLACE_WITH_PI_MODEL
#     weight: 50
#   - provider: openai-codex
#     id: gpt-6-luna
#     thinking: high
#     weight: 50
# Optional Run admission (omit → host runs.default_max_concurrent / max_queued).
# max_concurrent: 1
# max_queued: 20
# Optional hard timeout (omit → host runs.timeout_seconds). May exceed global default.
# timeout_seconds: 5400
admin:
  chat_id: REPLACE_WITH_ADMIN_DIRECT_CHAT_ID
schedules:
  - id: weekday-brief
    cron: "0 9 * * 1-5"
    timezone: Asia/Shanghai
    input: Prepare the weekday brief.
    notify:
      name: weekday-brief-group
# Optional: pin Pi skills (omit = Pi default discovery).
# skills:
#   mode: explicit
#   paths:
#     - ~/.agents/skills/tea-cli
# Optional external event subscription. Both lists use exact matches.
# listener:
#   sources:
#     - https://deploy.example.com/production
#   types:
#     - com.example.deployment.completed.v1
#   notify:
#     name: weekday-brief-group
