name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-patch-bump:
    name: PR Patch Bump
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.AUTO_BUMP_TOKEN || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags --depth=1 origin "$BASE_REF"

      - name: Detect whether PR needs a patch bump
        id: detect-bump
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: node scripts/should-bump-pr-version.mjs "origin/$BASE_REF"

      - name: Log skip reason
        if: steps.detect-bump.outputs.should_bump != 'true'
        env:
          BUMP_REASON: ${{ steps.detect-bump.outputs.reason }}
          MATCHED_FILES: ${{ steps.detect-bump.outputs.matched_files }}
        run: |
          echo "Skipping PR patch bump."
          printf 'Reason: %s\n' "$BUMP_REASON"
          printf 'Matched files: %s\n' "$MATCHED_FILES"

      - name: Bump patch version
        if: steps.detect-bump.outputs.should_bump == 'true'
        run: node scripts/bump-version.mjs patch

      - name: Commit patch bump
        if: steps.detect-bump.outputs.should_bump == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git diff --cached --quiet && { echo "No version bump changes to commit."; exit 0; }
          git commit -m "ci: auto bump patch version"
          git push origin "HEAD:$HEAD_REF"

  version-freshness:
    name: Version Freshness
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compare PR version with base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          mkdir -p .github/tmp
          git show "origin/$BASE_REF:package.json" > .github/tmp/base-package.json
          node scripts/check-version-freshness.mjs .github/tmp/base-package.json package.json

  test:
    name: Test (Node.js 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and linting
        run: pnpm check

      - name: Check types
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify packaged installation
        run: pnpm test:package
